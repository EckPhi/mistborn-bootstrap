[package]
name = "mistborn-bootstrap"
version = "0.5.2"
edition = "2024"
license = "MIT"
description = "Resumable runner for Mistborn Bootstrap"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
portable-pty = "0.9"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
vt100 = "0.16"
