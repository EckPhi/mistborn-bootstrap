name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shell tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Build collections
        run: ./tools/build.sh
      - name: Test resumable runner
        run: cargo test --locked
      - name: Test installer generator
        run: node --test tests/site.test.mjs
      - name: Test release versioning
        run: bash tests/versioning.sh
      - name: Test generated module options
        run: bash tests/generated.sh
      - name: Check generated scripts
        run: |
          git diff --exit-code -- dist/
          bash -n install.sh
          shellcheck -x install.sh lib/*.sh modules/*.sh tools/*.sh dist/*.sh
          shellcheck assets/mistborn
          for script in dist/*.sh; do sudo bash "$script" --dry-run --yes --user runner; done
