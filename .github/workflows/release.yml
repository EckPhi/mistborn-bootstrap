name: Release binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Set package version from release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 tools/set-version.py "${GITHUB_REF_NAME#v}"
      - name: Test runner
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Stage artifact
        run: |
          mkdir artifacts
          cp "target/${{ matrix.target }}/release/mistborn-bootstrap" "artifacts/mistborn-bootstrap-linux-${{ matrix.arch }}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "${{ matrix.arch }}" == "x86_64" ]]; then
            sed -E "s/(MISTBORN_DEFAULT_VERSION=\")v[0-9]+\.[0-9]+\.[0-9]+/\1${GITHUB_REF_NAME}/" install.sh > artifacts/install.sh
            grep -Fq "MISTBORN_DEFAULT_VERSION=\"${GITHUB_REF_NAME}\"" artifacts/install.sh
          fi
          file "artifacts/mistborn-bootstrap-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: mistborn-bootstrap-linux-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum mistborn-bootstrap-linux-* > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
